<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VeroFlow — Basic Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f5f7;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 640px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 32px;
        }
        h1 {
            color: #6a4fd4;
            font-size: 24px;
            margin-bottom: 4px;
        }
        .subtitle {
            color: #888;
            font-size: 13px;
            margin-bottom: 28px;
        }
        h3 {
            font-size: 15px;
            color: #333;
            margin-bottom: 8px;
        }
        input[type="file"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #6a4fd4;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin: 8px 0 20px 0;
        }
        button:hover { background: #5a3fc4; }
        pre {
            background: #f0f0f3;
            padding: 14px;
            border-radius: 8px;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .status-pass { color: #16a34a; font-weight: 700; }
        .status-fail { color: #dc2626; font-weight: 700; }
        .note {
            font-size: 12px;
            color: #999;
            margin-top: 24px;
            border-top: 1px solid #eee;
            padding-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 VeroFlow</h1>
        <p class="subtitle">Basic dashboard (fallback) — use the Next.js dashboard for the full experience</p>

        <h3>1. Upload APK</h3>
        <input type="file" id="apkFile" accept=".apk">
        <button onclick="uploadApk()">Upload APK</button>
        <p id="uploadResult"></p>

        <h3>2. Write Test Instruction</h3>
        <textarea id="instruction" rows="3" placeholder="e.g. tap the login button"></textarea>
        <button onclick="runTest()">▶ Run Test</button>

        <div id="statusResult"></div>
        <pre id="output">No result yet.</pre>

        <p class="note">Full dashboard with screenshots and screen-memory display: <strong>http://localhost:3000</strong></p>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";
        let uploadedApkPath = "";

        async function uploadApk() {
            const fileInput = document.getElementById("apkFile");
            const file = fileInput.files[0];
            if (!file) { alert("Select an APK file first"); return; }

            const formData = new FormData();
            formData.append("file", file);

            const res = await fetch(`${API_URL}/upload-apk`, { method: "POST", body: formData });
            const data = await res.json();
            uploadedApkPath = data.path;
            document.getElementById("uploadResult").innerText = "✅ " + data.message;
        }

        async function runTest() {
            if (!uploadedApkPath) { alert("Upload an APK first"); return; }
            const instruction = document.getElementById("instruction").value;
            if (!instruction) { alert("Write an instruction first"); return; }

            document.getElementById("statusResult").innerHTML = "⏳ Running...";

            const formData = new FormData();
            formData.append("apk_path", uploadedApkPath);
            formData.append("instruction", instruction);

            const res = await fetch(`${API_URL}/run-test`, { method: "POST", body: formData });
            const data = await res.json();

            const cls = data.status === "passed" ? "status-pass" : "status-fail";
            document.getElementById("statusResult").innerHTML =
                `<span class="${cls}">Status: ${data.status.toUpperCase()}</span>`;

            document.getElementById("output").innerText = JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
